name: PR title release check

on:
  workflow_call:
    outputs:
      release:
        description: Release impact declared by the PR title and its commits
        value: ${{ jobs.validate.outputs.release }}
      commit-count:
        description: Number of PR commits checked
        value: ${{ jobs.validate.outputs.commit-count }}

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
      commit-count: ${{ steps.check.outputs.commit-count }}
    steps:
      - name: Compare PR title with all commits
        id: check
        uses: maxmeis/workflows/actions/pr-title@22d1d72779b3e011dc845c9ea74f3c6ce94f077f # v1 source
