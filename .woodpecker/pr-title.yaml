# Public GitHub API requests need no repository secret, including on fork PRs.
when:
  - event: [pull_request, pull_request_metadata]

labels:
  platform: linux/amd64

# Keep checks for successive title edits in creation order.
concurrency:
  limit: 1
  group: pr-title-${CI_COMMIT_PULL_REQUEST}

steps:
  - name: validate-pr-title
    image: node:24.19.0-bookworm@sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b
    commands:
      - node scripts/pr-title.mjs
