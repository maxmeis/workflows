when:
  - event: push
    branch: main
  - event: [pull_request, manual]

labels:
  platform: linux/amd64

steps:
  - name: tests-and-coverage
    image: node:24.19.0-bookworm@sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b
    commands:
      - node --check actions/pr-title/src/policy.mjs
      - node --check actions/pr-title/src/index.mjs
      - node --check scripts/pr-title.mjs
      - node scripts/coverage.mjs
